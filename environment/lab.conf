LAB_NAME="Applied Security Laboratory - Group 13"
LAB_DESCRIPTION="Applied Security Laboratory Hand-in"

# --- Collision Domains (LANs) ---
# INTERNET: client <-> fw1
# DMZ: fw1 <-> fw2 <-> webserver
# INTERNAL: fw2 <-> authserver/caserver/logserver

# client[0]="INTERNET" #REMOVED because of Kathara bug
fw1[0]="INTERNET"
fw1[1]="DMZ"
fw2[0]="DMZ"
fw2[1]="INTERNAL"
webserver[0]="DMZ"
authserver[0]="INTERNAL"
caserver[0]="INTERNAL"
logserver[0]="INTERNAL"

client[bridged]="true"
client[port]="5900:5900"
client[port]="6080:6080"

# --- Container images ---
client[image]="client"
fw1[image]="fw1"
fw2[image]="fw2"
webserver[image]="webserver"
authserver[image]="authserver"
caserver[image]="caserver"
logserver[image]="logserver"

# Allow forwarding
fw1[sysctl]="net.ipv4.conf.all.forwarding=1"
fw2[sysctl]="net.ipv4.conf.all.forwarding=1"
authserver[sysctl]="net.ipv4.conf.all.forwarding=1"
